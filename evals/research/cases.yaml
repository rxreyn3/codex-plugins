- description: Research narrow path - shared artifact seam
  vars:
    case_id: narrow-research
    exercise_revision: false
    initial_prompt: "$rpivc-research {{DISCOVERY_ARTIFACT}}"
    simulator_instructions: |-
      You are the developer manually exercising a research workflow. The initial request has already been sent. Respond only to the current checkpoint and do not mention evaluation machinery or expected assertions.

      Decisions:
      - For a scope-tracer Run / Edit / Omit / Stop gate, reply exactly: Run
      - For Use scope / Revise scope / Stop, reply exactly: Use scope
      - For any analysis-wave Run / Edit / Omit / Stop gate, reply exactly: Run
      - For a grounded developer question, choose the recommended evidence-backed option, or reply: No correction; preserve the observed boundary
      - For Write artifact / Adjust / Stop, reply exactly: Write artifact
      - For Accept / Revise / Stop after the research artifact, reply exactly: Accept
      - After completion is acknowledged, reply exactly: ###STOP###
  provider:
    id: promptfoo:simulated-user
    config:
      stateful: true
      maxTurns: 20
      instructions: "{{simulator_instructions}}"
      initialMessages:
        - role: user
          content: "{{initial_prompt}}"
  assert: &research_assertions
    - type: javascript
      metric: deterministic-contract
      value: "file://{{ env.RPIVC_SOURCE_ROOT }}/evals/research/assertions.mjs"
    - type: agent-rubric
      metric: contract-and-evidence
      threshold: 1
      value: "file://{{ env.RPIVC_SOURCE_ROOT }}/evals/research/rubrics/contract-and-evidence.md"
      provider: &grader
        id: openai:codex-app-server:gpt-5.6-sol
        config:
          working_dir: "{{ env.RPIVC_EVIDENCE_ROOT }}/{{case_id}}"
          model: gpt-5.6-sol
          model_reasoning_effort: xhigh
          sandbox_mode: read-only
          network_access_enabled: false
          approval_policy: never
          skip_git_repo_check: true
          inherit_process_env: false
    - type: agent-rubric
      metric: interaction-and-parity
      threshold: 1
      value: "file://{{ env.RPIVC_SOURCE_ROOT }}/evals/research/rubrics/interaction-and-parity.md"
      provider: *grader

- description: Research cross-cutting path - adaptive waves and history
  vars:
    case_id: cross-cutting-research
    exercise_revision: true
    initial_prompt: "$rpivc-research {{DISCOVERY_ARTIFACT}}"
    simulator_instructions: |-
      You are the developer manually exercising a cross-cutting research workflow. The initial request has already been sent. Respond only to the current checkpoint. Do not volunteer evaluation criteria, diagnoses, or fixes.

      Decisions:
      - For every displayed scope or analysis Run / Edit / Omit / Stop gate, reply exactly: Run
      - For Use scope / Revise scope / Stop, reply exactly: Use scope
      - Approve each separately displayed dependent wave with Run, provided the complete run stays within three analysis cards total
      - For grounded developer questions, choose the recommended evidence-backed option, or reply: Keep the conflict visible
      - For Write artifact / Adjust / Stop, reply exactly: Write artifact
      - At the first Accept / Revise / Stop gate after the research artifact, reply exactly: Revise — In the Summary, state the final Answered, Partial, Conflicted, and Unanswered counts explicitly.
      - At the next Accept / Revise / Stop gate after the same revised artifact path is presented, reply exactly: Accept
      - After completion is acknowledged, reply exactly: ###STOP###
  provider:
    id: promptfoo:simulated-user
    config:
      stateful: true
      maxTurns: 30
      instructions: "{{simulator_instructions}}"
      initialMessages:
        - role: user
          content: "{{initial_prompt}}"
  assert: *research_assertions
