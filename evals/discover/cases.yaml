- description: Discovery minimal path - hypothetical spinner with no repository probe
  vars:
    case_id: no-probe-discovery
    initial_prompt: "$rpivc-discover Create a new widget spinner."
    simulator_instructions: |-
      You are the user manually exercising a discovery workflow. The initial request has already been sent for you. Be reactive: answer only the question currently asked, using the closest matching fact below, and do not volunteer later facts, evaluation criteria, diagnoses, or fixes.

      Facts:
      - You want a little ASCII widget to spin on screen for your baby.
      - This is a hypothetical standalone terminal script used only to exercise discovery. It is not a feature for rpiv-codex.
      - Success means you can run a script and observe it in a terminal.
      - It spins centrally with wings, slows down, and stops.
      - Do not install frameworks beyond what is already available.
      - There are no other desired outcomes or explicit deferrals. If asked about open questions, say: I don't know.

      Decisions:
      - If an agent is proposed, reply exactly: Omit
      - When the final Feature Requirements Document is presented with Accept / Revise / Stop, reply exactly: Accept
      - After the assistant confirms the stage is finished, reply exactly: ###STOP###
  provider:
    id: promptfoo:simulated-user
    config:
      stateful: true
      maxTurns: 16
      instructions: "{{simulator_instructions}}"
      initialMessages:
        - role: user
          content: "{{initial_prompt}}"
  assert:
    - type: javascript
      metric: deterministic-contract
      value: "file://{{ env.RPIVC_SOURCE_ROOT }}/evals/discover/assertions.mjs"
    - type: agent-rubric
      metric: contract-and-evidence
      threshold: 1
      value: "file://{{ env.RPIVC_SOURCE_ROOT }}/evals/discover/rubrics/contract-and-evidence.md"
      provider:
        id: openai:codex-app-server:gpt-5.6-sol
        config:
          working_dir: "{{ env.RPIVC_EVIDENCE_ROOT }}/{{case_id}}"
          model: gpt-5.6-sol
          model_reasoning_effort: xhigh
          sandbox_mode: read-only
          network_access_enabled: false
          approval_policy: never
          skip_git_repo_check: true
          inherit_process_env: false
    - type: agent-rubric
      metric: interaction-and-parity
      threshold: 1
      value: "file://{{ env.RPIVC_SOURCE_ROOT }}/evals/discover/rubrics/interaction-and-parity.md"
      provider:
        id: openai:codex-app-server:gpt-5.6-sol
        config:
          working_dir: "{{ env.RPIVC_EVIDENCE_ROOT }}/{{case_id}}"
          model: gpt-5.6-sol
          model_reasoning_effort: xhigh
          sandbox_mode: read-only
          network_access_enabled: false
          approval_policy: never
          skip_git_repo_check: true
          inherit_process_env: false

- description: Discovery integration path - brownfield agent gates and repository drift
  vars:
    case_id: brownfield-agent-gates
    initial_prompt: "$rpivc-discover In rpiv-codex, improve how final discovery artifacts present their source links."
    simulator_instructions: |-
      You are the user manually exercising a discovery workflow. The initial request has already been sent for you. Be reactive: answer only the question currently asked, using the closest matching fact or decision below. Do not mention evaluation machinery, repository drift, pass conditions, prior diagnoses, or proposed fixes.

      Facts:
      - You review discovery artifacts in Codex, but paths rendered as code or frontmatter values are not clickable, so navigating to evidence is tedious.
      - The current rpiv-codex repository is explicitly the product target.
      - Success means human-facing artifact, lineage, and source file-line references open when clicked in Codex.
      - Use concise repository-relative labels with absolute local Markdown-link targets in the artifact body and final chat response.
      - Keep frontmatter machine-readable and repeat useful lineage in the body. Avoid long paths in Markdown tables.
      - Do not change Codex's renderer, make YAML frontmatter interactive, add approval records, or change another workflow stage.
      - Use clickable body links only; preserve frontmatter as structured metadata.
      - Validate required body-link syntax and local targets at the final artifact inspection seam.
      - Automated checks cover syntax and target existence. Literal Codex click behavior remains a disclosed human-only check.
      - There are no explicit deferrals.

      Decisions:
      - For the first locator card, reply exactly: Run
      - If that Run is rejected because the card is stale and a refreshed locator card is shown, reply exactly: Run
      - If a later analyzer-only card is shown with concrete locator anchors, reply exactly: Run
      - If asked Refresh evidence / Continue with the disclosed stale boundary / Stop, reply exactly: Continue with the disclosed stale boundary
      - When the final Feature Requirements Document is presented with Accept / Revise / Stop, reply exactly: Accept
      - After the assistant confirms the stage is finished, reply exactly: ###STOP###
  provider:
    id: promptfoo:simulated-user
    config:
      stateful: true
      maxTurns: 24
      instructions: "{{simulator_instructions}}"
      initialMessages:
        - role: user
          content: "{{initial_prompt}}"
  assert:
    - type: javascript
      metric: deterministic-contract
      value: "file://{{ env.RPIVC_SOURCE_ROOT }}/evals/discover/assertions.mjs"
    - type: agent-rubric
      metric: contract-and-evidence
      threshold: 1
      value: "file://{{ env.RPIVC_SOURCE_ROOT }}/evals/discover/rubrics/contract-and-evidence.md"
      provider:
        id: openai:codex-app-server:gpt-5.6-sol
        config:
          working_dir: "{{ env.RPIVC_EVIDENCE_ROOT }}/{{case_id}}"
          model: gpt-5.6-sol
          model_reasoning_effort: xhigh
          sandbox_mode: read-only
          network_access_enabled: false
          approval_policy: never
          skip_git_repo_check: true
          inherit_process_env: false
    - type: agent-rubric
      metric: interaction-and-parity
      threshold: 1
      value: "file://{{ env.RPIVC_SOURCE_ROOT }}/evals/discover/rubrics/interaction-and-parity.md"
      provider:
        id: openai:codex-app-server:gpt-5.6-sol
        config:
          working_dir: "{{ env.RPIVC_EVIDENCE_ROOT }}/{{case_id}}"
          model: gpt-5.6-sol
          model_reasoning_effort: xhigh
          sandbox_mode: read-only
          network_access_enabled: false
          approval_policy: never
          skip_git_repo_check: true
          inherit_process_env: false
